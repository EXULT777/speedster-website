# Builds the site as static files and publishes it to GitHub Pages
# on every push to main. Can also be run by hand from the Actions tab.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build static site
        run: npx next build
        env:
          # The site lives at https://<user>.github.io/<repo>/. For a custom
          # domain, set PAGES_BASE_PATH to "" and NEXT_PUBLIC_SITE_URL to the domain.
          PAGES_BASE_PATH: /speedster-website
          NEXT_PUBLIC_SITE_URL: https://exult777.github.io/speedster-website
          # Add this secret in Settings → Secrets and variables → Actions to turn on email delivery.
          NEXT_PUBLIC_WEB3FORMS_KEY: ${{ secrets.WEB3FORMS_KEY }}
          # Firebase project that stores contact-form leads for /admin (see README).
          # Add both under Settings → Secrets and variables → Actions → Variables.
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
