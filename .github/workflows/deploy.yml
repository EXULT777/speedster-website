# Builds the site as static files and uploads them to the Namecheap hosting
# (public_html) on every push to main, including saves from /admin. Can also be
# run by hand from the Actions tab.
name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # "Delete everything" in /admin removes every file except this workflow.
      # Then there is nothing to build, and an empty site is published instead.
      - name: Check for website files
        id: site
        run: echo "present=$([ -f package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Publish an empty site
        if: steps.site.outputs.present != 'true'
        run: mkdir -p out
      - uses: actions/setup-node@v4
        if: steps.site.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.site.outputs.present == 'true'
      - name: Build static site
        if: steps.site.outputs.present == 'true'
        run: npx next build
        env:
          # Static export served from the root of the domain (see next.config.ts).
          PAGES_BASE_PATH: ""
          NEXT_PUBLIC_SITE_URL: https://speedsterlocknkey.com
          # Add this secret in Settings → Secrets and variables → Actions to turn on email delivery.
          NEXT_PUBLIC_WEB3FORMS_KEY: ${{ secrets.WEB3FORMS_KEY }}
          # Firebase project that stores contact-form leads for /admin (see README).
          # Add both under Settings → Secrets and variables → Actions → Variables.
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      # Uploads only what changed since the last deploy and removes files that
      # are no longer part of the site. Files it didn't upload (cgi-bin,
      # .well-known) are left alone. Add the three secrets under Settings →
      # Secrets and variables → Actions (see README).
      - name: Upload to Namecheap
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Encrypted FTP. "loose" accepts the hosting server's certificate,
          # which is issued to the server's own name rather than ftp.<domain>.
          protocol: ftps
          security: loose
          local-dir: ./out/
          # The FTP account's folder is public_html.
          server-dir: ./
